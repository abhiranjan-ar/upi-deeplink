[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "upi-deeplink"
version = "0.1.0"
description = "Build, parse and validate UPI payment deep links (upi://pay) per the NPCI UPI linking specification"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "Abhishek Ranjan"}]
keywords = ["upi", "payments", "india", "deep-link", "npci"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/abhiranjan-ar/upi-deeplink"
Issues = "https://github.com/abhiranjan-ar/upi-deeplink/issues"

[tool.setuptools.packages.find]
include = ["upi_deeplink*"]
